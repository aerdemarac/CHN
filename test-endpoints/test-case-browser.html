<!doctype html><body><pre id="result">RUNNING</pre><script>
(async()=>{
const results=[];
for(const page of ['medical-cases.php','feedback.php']) for(const width of [393,1440]) {
const frame=document.createElement('iframe');frame.style.width=width+'px';frame.style.height='1000px';frame.src=page+'?role=patient';document.body.append(frame);await new Promise(r=>frame.onload=r);
const d=frame.contentDocument,w=frame.contentWindow;
results.push([page,width,'viewport',w.innerWidth,'scrollWidth',d.documentElement.scrollWidth]);
if(d.documentElement.scrollWidth>w.innerWidth) throw Error('Overflow '+page+' '+width);
if(page==='medical-cases.php'){
 const dep=d.querySelector('[name=department_id]'),doc=d.querySelector('[name=doctor_id]');if(!doc.required)throw Error('Doctor must be required');doc.value='601';dep.value='2';dep.dispatchEvent(new w.Event('change'));if(doc.value!==''||!Array.from(doc.options).some(x=>x.value==='602')||Array.from(doc.options).some(x=>x.value==='601'))throw Error('Department reset/filter');
 dep.value='';dep.dispatchEvent(new w.Event('change'));if(doc.options.length!==1)throw Error('No doctor');
}else{
const msg=d.getElementById('feedback-message');msg.value='Fictional feedback';msg.dispatchEvent(new w.Event('input'));d.getElementById('feedback-form').dispatchEvent(new w.Event('submit',{cancelable:true}));if(!d.getElementById('feedback-result').textContent)throw Error('Feedback validation');
}
frame.remove();
}
for (const width of [393,1440]) {
const frame=document.createElement('iframe');frame.style.width=width+'px';frame.style.height='1000px';frame.src='medical-cases.php?role=patient';document.body.append(frame);await new Promise(r=>frame.onload=r);
const link=frame.contentDocument.querySelector('a[aria-label^="View my case"]');if(!link)throw Error('Patient case fixture required');frame.src=link.href;await new Promise(r=>frame.onload=r);
const d=frame.contentDocument,status=d.querySelector('.medical-cases__status-editor');if(!status || status.open)throw Error('Patient status collapsed');status.querySelector('summary').click();if(!status.open || !status.querySelector('[name=action][value=update_status]') || status.closest('dd').previousElementSibling.textContent!=='Case status')throw Error('Patient inline status');if(d.documentElement.scrollWidth>frame.contentWindow.innerWidth)throw Error('Patient status overflow');results.push(['patient status pencil',width,'PASS']);frame.remove();
}
for (const width of [393,1440]) {
const frame=document.createElement('iframe');frame.style.width=width+'px';frame.style.height='1000px';frame.src='medical-cases.php?role=doctor';document.body.append(frame);await new Promise(r=>frame.onload=r);
const link=frame.contentDocument.querySelector('a[aria-label^="View clinical details"]');
if(!link)throw Error('Doctor case fixture required');
frame.src=link.href;await new Promise(r=>frame.onload=r);
const d=frame.contentDocument,w=frame.contentWindow;
const editor=d.querySelector('.medical-cases__triage-editor');
if(!editor || editor.open)throw Error('Expected collapsed triage editor');
editor.querySelector('summary').click();if(!editor.open)throw Error('Pencil did not open editor');
if(editor.querySelector('[name=tier_color]').options.length!==3)throw Error('Triage choices');
if(!d.querySelector('[name=action][value=update_doctor_status]'))throw Error('Doctor status form');
const status=d.querySelector('.medical-cases__status-editor');if(!status || status.open)throw Error('Expected collapsed status editor');status.querySelector('summary').click();if(!status.open || status.closest('dd').previousElementSibling.textContent!=='Case status')throw Error('Inline status pencil');
if(d.documentElement.scrollWidth>w.innerWidth)throw Error('Doctor details overflow');
results.push(['doctor detail pencil/status',width,'PASS']);frame.remove();
}
document.getElementById('result').textContent='PASS '+JSON.stringify(results);
})().catch(e=>document.getElementById('result').textContent='FAIL '+e);
</script></body>
