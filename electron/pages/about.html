<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
    <title data-i18n="about.title">About</title>
    <link rel="stylesheet" href="css/desktop.css">

    <script src="js/desktop.js" defer></script>
    <script src="js/about.js" defer></script>

<main class="dialog about">

        <dt data-i18n="about.support">Support</dt>
